[project]
name = "open-source-community"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "nb-log>=14.4",
    "pycryptodome>=3.23.0",
    "vorm==0.1.6",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "oss2>=2.18.0",
    "aiofiles>=24.1.0",
    "openpyxl>=3.1.0",
    "orjson>=3.9.0",
    "httpx>=0.28.1",
    "apscheduler[asyncio]>=3.11.3",
    "gunicorn>=26.2.0",
]

[[tool.uv.index]]
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"
default = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
typeCheckingMode = "basic"

[tool.ruff]
# Set the maximum line length to 79.
line-length = 150
indent-width = 4

[tool.ruff.lint]
preview = true
# Add the `line-too-long` rule to the enforced rule set.
select = ["E101", "E112", "E113", "F401", "F821"]
exclude = [
    "build/", # 构建输出目录
    "dist/", # 分发文件目录
    "*.egg-info/", # Python 包的元数据目录
    "__pycache__/", # Python 缓存文件目录
    ".pytest_cache/", # pytest 缓存目录
    ".mypy_cache/", # mypy 缓存目录
    ".venv/", # 虚拟环境目录
    "venv/", # 虚拟环境目录
    "env/", # 虚拟环境目录
    "tests/data/", # 测试数据目录
    "**/*.json", # 所有 JSON 文件
    "**/*.csv", # 所有 CSV 文件
    "**/*.xml", # 所有 XML 文件
    "migrations/", # Django 迁移文件目录
    "**/generated/", # 自动生成的代码目录
    "vendor/", # 第三方库目录
    "lib/", # 第三方库目录
    ".*", # 所有隐藏文件和目录
    ".git/", # Git 目录
    ".github/", # GitHub 配置目录
    ".idea/", # PyCharm 配置目录
    ".vscode/", # VS Code 配置目录
    "setup.py", # 项目的 setup.py 文件
    "requirements.txt", # 依赖文件
    "*.log", # 所有日志文件
    "**/*.ipynb", # 所有 Jupyter Notebook 文件
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
